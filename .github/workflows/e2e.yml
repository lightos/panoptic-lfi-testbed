name: Panoptic E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      panoptic_ref:
        description: Panoptic branch, tag, or commit to test
        required: false
        default: hardening-review

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out testbed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out Panoptic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: lightos/Panoptic
          ref: ${{ inputs.panoptic_ref || 'hardening-review' }}
          path: Panoptic

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Panoptic/pyproject.toml

      - name: Install Panoptic
        run: python -m pip install -e ./Panoptic

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Run black-box E2E matrix
        env:
          PANOPTIC_DIR: ${{ github.workspace }}/Panoptic
        run: ./tests/e2e.sh
